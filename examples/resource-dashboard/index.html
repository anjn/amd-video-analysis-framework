<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMD APU · Resource Monitor</title>
<style>
:root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; background: #080e16; color: #edf3fc; }
* { box-sizing: border-box; }
body { margin: 0; }
button, select { font: inherit; color: #edf3fc; background: #162333; border: 1px solid #35465c; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
button:hover, select:hover { border-color: #8ca3bc; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid #5be1ec; outline-offset: 4px; }
a { color: #78e4ed; }
.controls { min-height: 72px; padding: 14px 24px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; background: #101b28; border-bottom: 1px solid #35465c; font-size: 14px; }
.controls label { display: flex; align-items: center; gap: 9px; }
.controls .hint { color: #acbed2; margin-left: auto; }
#viewport { width: 100%; overflow: hidden; }
#dashboard { width: 1920px; height: 1080px; transform-origin: top left; padding: 32px 40px; background: radial-gradient(ellipse at 95% 0%, #142938 0%, #0b131f 48%); }
header { display: flex; align-items: center; justify-content: space-between; height: 120px; margin-bottom: 20px; }
.hardware { font-size: 44px; font-weight: 550; line-height: 1.3; letter-spacing: -.7px; }
.hardware div:last-child { color: #b4c5d8; }
.header-right { display: flex; align-items: center; gap: 28px; text-align: right; }
.badge { font-size: 28px; font-weight: 700; padding: 9px 13px; border: 1px solid #b99245; border-radius: 6px; color: #f5c76f; background: #352b1b; }
#clock { font: 550 64px ui-monospace, monospace; font-variant-numeric: tabular-nums; }
#date { font-size: 36px; color: #b4c5d8; margin-top: 4px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
.panel { background: #111e2ce6; border: 1px solid #2a3a4e; border-radius: 12px; overflow: hidden; }
.kpi { height: 156px; padding: 18px 28px; position: relative; display: flex; align-items: center; justify-content: space-between; }
.kpi::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent); }
.label { font-size: 36px; font-weight: 550; color: #bdcce0; }
.number { font-size: 80px; line-height: 1.15; letter-spacing: -2px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.number small { font-size: 36px; letter-spacing: 0; font-weight: 400; color: #a5b9ce; margin-left: 7px; }
.cpu { --accent: #61dcf3; } .gpu { --accent: #ad9aff; } .dram { --accent: #f6bd69; }
.charts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
.chart { height: 330px; padding: 22px 24px 18px; }
.chart-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; height: 40px; }
h2 { font-size: 36px; font-weight: 550; margin: 0; }
.legend { display: flex; gap: 20px; font-size: 32px; color: #c0cfe1; }
.legend span::before, .key::before { content: ''; display: inline-block; width: 16px; height: 16px; border-radius: 4px; margin-right: 10px; background: var(--line); }
canvas { display: block; width: 100%; height: 230px; }
.details { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
.memory { height: 332px; padding: 22px 26px; }
.memory-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
#memory-value { font-size: 40px; font-weight: 550; font-variant-numeric: tabular-nums; }
.meter { display: flex; height: 38px; background: #293b4d; border-radius: 7px; overflow: hidden; }
.meter > div { height: 100%; flex: 0 0 auto; width: 0; }
.meter.unavailable { background: repeating-linear-gradient(135deg, #293b4d 0 12px, #1a293a 12px 24px); }
#host-meter { background: #60dcb0; } #reserved-meter { background: #ad9aff; }
.memory-legend { display: flex; justify-content: space-between; font-size: 32px; margin: 13px 0 20px; color: #bdcce0; font-variant-numeric: tabular-nums; }
.gpu-memory { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.gpu-memory .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 32px; font-variant-numeric: tabular-nums; }
.gpu-memory .meter { height: 20px; }
#gtt-meter { background: #f6bd69; } #vram-meter { background: #ad9aff; }
.engines { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.engine { height: 332px; padding: 28px 18px; display: flex; flex-direction: column; justify-content: space-between; }
.engine h2 { font-size: 34px; line-height: 1.25; min-height: 86px; }
.engine .number { font-size: 68px; letter-spacing: -2px; }
.engine .number small { font-size: 32px; margin-left: 3px; }
.engine-meter { height: 18px; background: #293b4d; border-radius: 6px; overflow: hidden; }
.engine-meter div { height: 100%; width: 0; background: #61dcf3; }
.engine-meter.unavailable { background: repeating-linear-gradient(135deg, #293b4d 0 10px, #1a293a 10px 20px); }
.power-mark { height: 18px; width: 46px; border-radius: 6px; background: #f6bd69; }
body.video .controls { display: none; }
</style>
</head>
<body>
<nav class="controls" aria-label="Prototype controls">
  <strong>Design preview</strong>
  <label>Scenario <select id="scenario"><option value="mixed">Mixed load</option><option value="idle">Idle</option><option value="cpu">CPU load</option><option value="gpu">GPU load</option></select></label>
  <button id="pause" type="button">Pause</button>
  <label><input id="missing" type="checkbox"> Simulate missing GPU metrics</label>
  <a href="?video=1">Video-only view ↗</a>
  <span id="status" class="hint" role="status">Synthetic data · no hardware access · 1920 × 1080 composition</span>
</nav>
<div id="viewport">
<main id="dashboard" aria-label="System resource dashboard with simulated metrics">
  <header>
    <div class="hardware"><div>AMD Ryzen AI 9 HX 370</div><div>AMD Radeon 890M</div></div>
    <div class="header-right"><div class="badge">DEMO DATA</div><div><div id="clock">--:--:--</div><div id="date">—</div></div></div>
  </header>
  <section class="kpis" aria-label="Current readings">
    <article class="panel kpi cpu"><div class="label">CPU</div><div class="number"><span id="cpu-value">—</span><small>%</small></div></article>
    <article class="panel kpi gpu"><div class="label">GPU</div><div class="number"><span id="gpu-value">—</span><small>%</small></div></article>
    <article class="panel kpi dram"><div class="label">DRAM</div><div class="number"><span id="dram-value">—</span><small>GB/s</small></div></article>
  </section>
  <section class="charts" aria-label="Last 60 seconds">
    <article class="panel chart"><div class="chart-head"><h2>CPU</h2></div><canvas id="cpu-chart" width="1100" height="460" role="img" aria-label="CPU utilization over the last 60 seconds, 0 to 100 percent"></canvas></article>
    <article class="panel chart"><div class="chart-head"><h2>GPU</h2></div><canvas id="gpu-chart" width="1100" height="460" role="img" aria-label="GPU utilization over the last 60 seconds, 0 to 100 percent"></canvas></article>
    <article class="panel chart"><div class="chart-head"><h2>DRAM</h2><div class="legend"><span style="--line:#f6bd69">Read</span><span style="--line:#60dcb0">Write</span></div></div><canvas id="dram-chart" width="1100" height="460" role="img" aria-label="DRAM read and write bandwidth over the last 60 seconds in gigabytes per second"></canvas></article>
  </section>
  <section class="details" aria-label="Memory and hardware engines">
    <article class="panel memory">
      <div class="memory-heading"><h2>Memory</h2><strong id="memory-value">—</strong></div>
      <div class="meter" id="system-meter" role="img" aria-label="Host usage and reserved VRAM"><div id="host-meter"></div><div id="reserved-meter"></div></div>
      <div class="memory-legend"><span class="key" style="--line:#60dcb0" id="host-detail">Host —</span><span class="key" style="--line:#ad9aff" id="reserved-detail">Reserved —</span><span class="key" style="--line:#293b4d" id="available-detail">Available —</span></div>
      <div class="gpu-memory">
        <div><div class="row"><span>GTT</span><span id="gtt-value">—</span></div><div class="meter" id="gtt-track" role="img" aria-label="GTT allocation"><div id="gtt-meter"></div></div></div>
        <div><div class="row"><span>VRAM</span><span id="vram-value">—</span></div><div class="meter" id="vram-track" role="img" aria-label="VRAM usage within its reservation"><div id="vram-meter"></div></div></div>
      </div>
    </article>
    <div class="engines">
      <article class="panel engine"><h2>Socket<br>power</h2><div class="number"><span id="socket-value">—</span><small>W</small></div><div class="power-mark"></div></article>
      <article class="panel engine"><h2>VCN</h2><div class="number"><span id="vcn-value">—</span><small>%</small></div><div class="engine-meter" id="vcn-track" role="img" aria-label="VCN utilization"><div id="vcn-meter"></div></div></article>
      <article class="panel engine"><h2>VPE</h2><div class="number"><span id="vpe-value">—</span><small>%</small></div><div class="engine-meter" id="vpe-track" role="img" aria-label="VPE utilization of observable DRM clients"><div id="vpe-meter"></div></div></article>
    </div>
  </section>
</main>
</div>
<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const period = 100, windowMs = 60000, maxSamples = windowMs / period + 1;
  const history = [];
  let scenario = 'mixed', paused = false, missing = false, phase = 0;
  let time = Date.now(), lastTick = performance.now();
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const valid = v => typeof v === 'number' && Number.isFinite(v);
  const format = (v, unit = '', places = 1) => valid(v) ? v.toFixed(places) + unit : 'N/A';
  // Deterministic, smoothly changing fixtures. No random reads or system access.
  function mockSample(t, p) {
    const base = {idle: [6, 3, 3], cpu: [84, 13, 24], gpu: [24, 92, 52], mixed: [47, 73, 39]}[scenario];
    const wave = Math.sin(p * .53) * 5 + Math.sin(p * 1.73) * 2 + Math.cos(p * .19) * 7;
    const cpu = clamp(base[0] + wave, 0, 100);
    const gpu = clamp(base[1] + wave * .7 + Math.sin(p * .29) * 8, 0, 100);
    const bandwidth = Math.max(.2, base[2] + wave * .45 + Math.sin(p * .37) * 4);
    const hostUsed = 6.6 + base[1] * .045 + Math.sin(p * .11) * .25;
    const s = {timestampMs: t, cpuPct: cpu, gpuPct: gpu, dramReadGBs: bandwidth * .66,
      dramWriteGBs: bandwidth * .34, hostUsedGiB: hostUsed, hostTotalGiB: 30,
      vramGiB: .48, vramReservedGiB: 2, gttGiB: 1.4 + base[1] * .025, gttTotalGiB: 24, socketW: 9 + cpu * .18 + gpu * .23,
      vcnPct: clamp(base[1] * .65 + wave, 0, 100), vpePct: clamp(base[1] * .38 + wave * .5, 0, 100)};
    if (missing) for (const k of ['gpuPct', 'dramReadGBs', 'dramWriteGBs', 'vramGiB', 'vramReservedGiB', 'gttGiB', 'gttTotalGiB', 'socketW', 'vcnPct', 'vpePct']) s[k] = null;
    return s;
  }
  // Data boundary for a future collector. null/absent/non-finite metrics are gaps.
  // New samples must have strictly increasing timestamps; history is bounded.
  function ingest(sample) {
    if (!sample || !valid(sample.timestampMs) || (history.length && sample.timestampMs <= history.at(-1).timestampMs)) return false;
    history.push({...sample});
    const cutoff = sample.timestampMs - windowMs;
    while (history.length && (history[0].timestampMs < cutoff || history.length > maxSamples)) history.shift();
    return true;
  }
  function chart(id, fields, colors, maximum) {
    const canvas = $(id), ctx = canvas.getContext('2d');
    const w = canvas.width / 2, h = canvas.height / 2;
    ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, w, h);
    const left = 3, right = w - 3, top = 8, bottom = h - 4;
    ctx.lineWidth = 1; ctx.strokeStyle = '#29394c';
    for (let i = 0; i <= 4; ++i) {
      const y = top + (bottom - top) * i / 4;
      ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
    }
    if (!history.length) return;
    const end = history.at(-1).timestampMs;
    fields.forEach((field, index) => {
      // Close and fill each contiguous run independently; never bridge a gap.
      let points = [], previous = 0;
      function flush() {
        if (!points.length) return;
        const fill = ctx.createLinearGradient(0, top, 0, bottom);
        fill.addColorStop(0, colors[index] + '88'); fill.addColorStop(1, colors[index] + '16');
        ctx.beginPath(); ctx.moveTo(points[0][0], bottom);
        for (const [x, y] of points) ctx.lineTo(x, y);
        ctx.lineTo(points.at(-1)[0], bottom); ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
        ctx.beginPath(); ctx.moveTo(...points[0]);
        for (const point of points.slice(1)) ctx.lineTo(...point);
        ctx.strokeStyle = colors[index]; ctx.lineWidth = 3.5; ctx.stroke(); points = [];
      }
      for (const sample of history) {
        const value = sample[field];
        if (!valid(value)) { flush(); continue; }
        if (sample.timestampMs - previous > period * 2.5) flush();
        const x = left + (sample.timestampMs - end + windowMs) / windowMs * (right - left);
        const y = bottom - clamp(value / maximum, 0, 1) * (bottom - top);
        points.push([x, y]); previous = sample.timestampMs;
      }
      flush();
    });
  }
  const nonnegative = v => valid(v) && v >= 0;
  function meter(track, segments, known, label) {
    $(track).classList.toggle('unavailable', !known);
    $(track).setAttribute('aria-label', label);
    for (const [id, width] of segments) $(id).style.width = (known ? width : 0) + '%';
  }
  function memory(s) {
    const hostKnown = nonnegative(s.hostUsedGiB) && valid(s.hostTotalGiB) && s.hostTotalGiB > 0 && s.hostUsedGiB <= s.hostTotalGiB;
    const totalKnown = hostKnown && nonnegative(s.vramReservedGiB);
    const capacity = totalKnown ? s.hostTotalGiB + s.vramReservedGiB : null;
    const allocated = totalKnown ? s.hostUsedGiB + s.vramReservedGiB : null;
    const pct = totalKnown ? allocated / capacity * 100 : null;
    $('memory-value').textContent = totalKnown ? format(allocated) + ' / ' + format(capacity, ' GiB', Number.isInteger(capacity) ? 0 : 1) + ' · ' + format(pct, '%', 0) : 'N/A';
    $('host-detail').textContent = 'Host ' + format(hostKnown ? s.hostUsedGiB : null);
    $('reserved-detail').textContent = 'Reserved ' + format(nonnegative(s.vramReservedGiB) ? s.vramReservedGiB : null);
    $('available-detail').textContent = 'Available ' + format(hostKnown ? s.hostTotalGiB - s.hostUsedGiB : null);
    meter('system-meter', [['host-meter', s.hostUsedGiB / capacity * 100], ['reserved-meter', s.vramReservedGiB / capacity * 100]], totalKnown,
      'Host including GTT, reserved VRAM, and available memory in GiB: ' + $('memory-value').textContent);
    const gttKnown = nonnegative(s.gttGiB) && valid(s.gttTotalGiB) && s.gttTotalGiB > 0 && s.gttGiB <= s.gttTotalGiB;
    $('gtt-value').textContent = gttKnown ? format(s.gttGiB) + ' / ' + format(s.gttTotalGiB, ' GiB', Number.isInteger(s.gttTotalGiB) ? 0 : 1) : 'N/A';
    meter('gtt-track', [['gtt-meter', s.gttGiB / s.gttTotalGiB * 100]], gttKnown, 'GTT allocation relative to its allocation limit: ' + $('gtt-value').textContent);
    const vramKnown = nonnegative(s.vramGiB) && valid(s.vramReservedGiB) && s.vramReservedGiB > 0 && s.vramGiB <= s.vramReservedGiB;
    $('vram-value').textContent = vramKnown ? format(s.vramGiB) + ' / ' + format(s.vramReservedGiB, ' GiB', Number.isInteger(s.vramReservedGiB) ? 0 : 1) : 'N/A';
    meter('vram-track', [['vram-meter', s.vramGiB / s.vramReservedGiB * 100]], vramKnown, 'VRAM usage within reserved capacity: ' + $('vram-value').textContent);
  }
  function render() {
    if (!history.length) return;
    const s = history.at(-1), total = valid(s.dramReadGBs) && valid(s.dramWriteGBs) ? s.dramReadGBs + s.dramWriteGBs : null;
    $('cpu-value').textContent = format(s.cpuPct);
    $('gpu-value').textContent = format(s.gpuPct);
    $('dram-value').textContent = format(total);
    memory(s);
    $('socket-value').textContent = format(s.socketW, '', 0);
    for (const engine of ['vcn', 'vpe']) {
      const value = s[engine + 'Pct'];
      const known = valid(value) && value >= 0 && value <= 100;
      $(engine + '-value').textContent = format(known ? value : null, '', 0);
      meter(engine + '-track', [[engine + '-meter', value]], known, engine.toUpperCase() + ' utilization: ' + (known ? format(value, '%', 0) : 'unavailable'));
    }
    const d = new Date(s.timestampMs);
    $('clock').textContent = d.toLocaleTimeString('en-GB', {hour12: false});
    $('date').textContent = d.toLocaleDateString('en-GB', {day: '2-digit', month: 'short', year: 'numeric'});
    $('status').textContent = (paused ? 'PAUSED' : 'SIMULATED') + ' · ' + ({mixed: 'MIXED LOAD', cpu: 'CPU LOAD', gpu: 'GPU LOAD', idle: 'IDLE'})[scenario] + (missing ? ' · GPU METRICS UNAVAILABLE' : '');
    $('status').style.color = paused || missing ? '#f6bd69' : '#70dfb6';
    chart('cpu-chart', ['cpuPct'], ['#61dcf3'], 100);
    chart('gpu-chart', ['gpuPct'], ['#ad9aff'], 100);
    const peak = Math.max(0, ...history.flatMap(x => [x.dramReadGBs, x.dramWriteGBs]).filter(valid));
    const axis = Math.max(20, Math.ceil(peak / 20) * 20);
    chart('dram-chart', ['dramReadGBs', 'dramWriteGBs'], ['#f6bd69', '#60dcb0'], axis);
  }
  function fit() {
    const scale = Math.min(1, document.documentElement.clientWidth / 1920);
    $('dashboard').style.transform = `scale(${scale})`;
    $('viewport').style.height = (1080 * scale) + 'px';
  }
  $('scenario').addEventListener('change', event => { scenario = event.target.value; render(); });
  $('pause').addEventListener('click', () => {
    paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; lastTick = performance.now(); render();
  });
  $('missing').addEventListener('change', event => { missing = event.target.checked; });
  if (new URLSearchParams(location.search).get('video') === '1') document.body.classList.add('video');
  window.addEventListener('resize', fit);
  for (let i = -600; i <= 0; ++i) ingest(mockSample(time + i * period, i * period / 1000));
  fit(); render();
  setInterval(() => {
    const now = performance.now(), elapsed = now - lastTick; lastTick = now;
    if (paused) return;
    time += elapsed; phase += elapsed / 1000;
    ingest(mockSample(time, phase)); render();
  }, period);
  window.ResourceDashboard = Object.freeze({
    ingest(sample) { const ok = ingest(sample); if (ok) render(); return ok; },
    snapshot() { return {sample: {...history.at(-1)}, samples: history.length, maxSamples, paused, scenario}; }
  });
})();
</script>
</body>
</html>

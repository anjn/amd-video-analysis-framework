# User guide (docs/guide/) at the site root and developer information (docs/dev/) under
# /dev/, in English (/) and Japanese (/ja/). Stage the sources first:
#   python3 scripts/docs_site.py && mkdocs serve
site_name: AMD Video Analysis Framework
site_description: GStreamer video analytics for AMD APUs with VA, VPE, HIP and MIGraphX
site_url: https://anjn.github.io/amd-video-analysis-framework/
repo_url: https://github.com/anjn/amd-video-analysis-framework
repo_name: anjn/amd-video-analysis-framework
edit_uri: ""
docs_dir: .site-src
site_dir: site
strict: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search:
      lang: [en, ja]
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
        - locale: ja
          name: 日本語
          site_name: AMD Video Analysis Framework
          site_description: AMD APU 向けの GStreamer 映像解析フレームワーク（VA、VPE、HIP、MIGraphX）
          nav_translations:
            Home: ホーム
            Guide: ガイド
            Installation: インストール
            Quick start: クイックスタート
            Concepts: 仕組み
            Building pipelines: パイプラインの作り方
            Using the SDK: SDK の組み込み
            NVR demo: NVR デモ
            Migrating from other frameworks: 他のフレームワークからの移行
            Developer information: 開発者向け情報
            Framework: フレームワーク
            Overview: 概要
            Host build and reference runs: ホストでのビルドと基準実行
            Memory and execution contracts: メモリと実行の規約
            Elements: 要素
            Model-info: model-info
            Metadata and Python: メタデータと Python
            Encoding, recording and serving: エンコード、録画、配信
            SDK reference: SDK リファレンス
            Coming from DL Streamer: DL Streamer からの移行
            Coming from DeepStream: DeepStream からの移行
            Decode and presentation telemetry: デコードと表示のテレメトリ
            Desktop video management: デスクトップの映像管理
            Person search: 人物検索
            AI scheduling and evaluation: AI のスケジューリングと評価
            Resource dashboard: リソースダッシュボード
            Visual prototype: 外観プロトタイプ
            File-to-RTSP server: ファイル RTSP サーバー
            Validation: 検証
            Validation and reproduction: 検証と再現
            Framework validation: フレームワークの検証

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  - Guide:
      - Installation: install.md
      - Quick start: quickstart.md
      - Concepts: concepts.md
      - Building pipelines: pipelines.md
      - Using the SDK: sdk.md
      - NVR demo: nvr-demo.md
      - Migrating from other frameworks: migration.md
  - Developer information:
      - Framework:
          - Overview: dev/framework.md
          - Host build and reference runs: dev/host-build.md
          - Memory and execution contracts: dev/architecture.md
          - Elements: dev/elements.md
          - Model-info: dev/model-info.md
          - Metadata and Python: dev/metadata-and-python.md
          - Encoding, recording and serving: dev/encode-and-serve.md
          - SDK reference: dev/sdk-guide.md
          - Coming from DL Streamer: dev/migration-from-dlstreamer.md
          - Coming from DeepStream: dev/migration-from-deepstream.md
          - Decode and presentation telemetry: dev/telemetry.md
      - NVR demo:
          - dev/nvr/README.md
          - Desktop video management: dev/nvr/vms.md
          - Person search: dev/nvr/nvr-search.md
          - AI scheduling and evaluation: dev/nvr/nvr-ai-performance.md
      - Resource dashboard:
          - dev/resource-dashboard/README.md
          - Visual prototype: dev/resource-dashboard/PROTOTYPE.md
      - File-to-RTSP server: dev/rtsp-files/README.md
      - Validation:
          - Validation and reproduction: dev/validation.md
          - Framework validation: dev/framework-validation.md
